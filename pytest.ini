; pytest configuration for the Deal Room Dashboard (task 1.4, design §7.1–§7.2).
;
; Kept in pytest.ini rather than in pyproject.toml so that `rootdir` resolution
; is unambiguous: pytest.ini is the highest-precedence config file, and every
; documented invocation (Makefile, CI) is therefore rooted at the repository
; root whatever directory it is launched from.

[pytest]
DJANGO_SETTINGS_MODULE = config.settings.base

; There is deliberately no separate test-settings module. config.settings.base
; configures PostgreSQL and nothing else (design §2.2), so tests run against the
; same backend, the same USE_TZ/TIME_ZONE storage contract, and the same five
; §3.0.3 deployment keys as production. A test-only settings module is the usual
; place a SQLite fallback gets introduced; not having one removes the temptation.

testpaths = dashboard
python_files = test_*.py

addopts =
    ; Unknown markers and unknown ini keys are errors, so a typo'd marker cannot
    ; silently select zero tests — which for `-m migrations` (task 3.5) would
    ; mean a green build that ran no migration assertions at all.
    --strict-markers
    --strict-config
    ; A fixed Hypothesis seed. Design §7.2's iteration floors only buy
    ; reproducibility if the same seed is replayed, so a CI failure can be
    ; re-run locally and land on the same counterexample instead of a different
    ; one. Override for a wider search with `--hypothesis-seed=random`.
    --hypothesis-seed=0
    ; Summarise every non-passing outcome at the end of the run, so a skipped
    ; property test is visible rather than a silent dot.
    -ra

; --------------------------------------------------------------------------
; Markers
; --------------------------------------------------------------------------
; `migrations` and `concurrency` are load-bearing: CI selects the first as its
; own step, and conftest.py asserts a property of the second.
markers =
    migrations: the fresh-migrate schema and privilege assertions of task 3.5 (§7.4, §7.6). CI runs these as a separate step; scripts/check_deferred_activations.py fails the build if trigger migrations exist and nothing carries this marker.
    concurrency: needs genuine concurrent transactions on separate connections — Properties 10, 24, 42, 45 and the attempt_number example of §7.3. Must run under TransactionTestCase or `django_db(transaction=True)`; conftest.py asserts no outer transaction is open.
    property: implements one of the 46 numbered correctness properties of design §6.
    e2e: Playwright browser flow (§7.4). Requires `playwright install`; the browser install step is owned by the task that adds the first e2e test.
    performance: a §7.5 budget assertion against a seeded dataset.

; --reuse-db is deliberately NOT enabled here.
;
; Two reasons, both specific to this design:
;
;   1. It would make the task 3.5 migration test meaningless. That test asserts
;      that a *fresh* migrate installs the ten triggers of §4.6, the §4.3 CHECKs,
;      the generated columns, the genesis partial unique index and the §4.7
;      indexes. Reusing a database skips migrations entirely, so the test would
;      pass against a schema built by an older revision — exactly the failure it
;      exists to detect.
;   2. It interacts badly with the TransactionTestCase runs that the concurrency
;      properties require. Those tests truncate tables rather than roll back, so
;      any state a reused database carries between sessions is state they will
;      flush; combined with skipped migrations, a schema drift shows up as a
;      confusing data error inside an unrelated property.
;
; For a fast local edit loop it is safe to pass `--reuse-db` explicitly *and*
; `--create-db` on the first run after any migration change:
;
;     make test PYTEST_ARGS="--reuse-db"
;     make test PYTEST_ARGS="--reuse-db --create-db"   # after editing migrations
;
; conftest.py prints a warning banner whenever --reuse-db is in effect, and
; refuses the combination of --reuse-db with `-m migrations`.
