[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deal-room-dashboard"
version = "0.1.0"
description = "Deal Room Dashboard — operator console over the B2B outreach pipeline"
readme = "README.md"
requires-python = ">=3.11"

# Runtime stack fixed by design §2.2 (Django 5 + PostgreSQL 16),
# §2.3 (server-rendered templates + HTMX) and §2.7 (Celery + Redis).
dependencies = [
    "Django>=5.2,<6.0",
    "psycopg[binary]>=3.2,<4.0",
    "celery>=5.4,<6.0",
    "redis>=5.0,<7.0",
    "django-htmx>=1.19,<2.0",
]

# Dev/test dependencies (pytest, hypothesis, import-linter, ...) are owned by task 1.4.

[tool.setuptools]
packages = [
    "config",
    "config.settings",
    "dashboard",
    "dashboard.adapter",
    "dashboard.migrations",
    "dashboard.models",
    "dashboard.services",
    "dashboard.views",
]
