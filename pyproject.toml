[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "b2b-bot"
version = "0.1.0"
description = "Eight-employee B2B lead generation and deal-room automation platform"
requires-python = ">=3.12,<3.13"
dependencies = [
  "Django>=5.1,<5.3",
  "psycopg[binary]>=3.2,<4",
  "celery>=5.4,<6",
  "redis>=5,<7",
  "django-htmx>=1.21,<2",
  "gunicorn>=23,<24",
  "whitenoise>=6.8,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-django>=4.9,<5",
  "hypothesis[django]>=6,<7",
  "factory-boy>=3.3,<4",
  "time-machine>=2.16,<3",
  "playwright>=1.49,<2",
  "respx>=0.22,<1",
  "import-linter>=2.1,<3",
]

[tool.setuptools.packages.find]
include = ["config*", "dashboard*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.base"
python_files = ["test_*.py", "*_test.py"]
addopts = "-q --hypothesis-seed=20260829"
