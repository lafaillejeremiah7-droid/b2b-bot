[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deal-room-dashboard"
version = "0.1.0"
description = "Deal Room Dashboard — operator console over the B2B outreach pipeline"
readme = "README.md"
requires-python = ">=3.11"

# Runtime stack fixed by design §2.2 (Django 5 + PostgreSQL 16),
# §2.3 (server-rendered templates + HTMX) and §2.7 (Celery + Redis).
dependencies = [
    "Django>=5.2,<6.0",
    "psycopg[binary]>=3.2,<4.0",
    "celery>=5.4,<6.0",
    "redis>=5.0,<7.0",
    "django-htmx>=1.19,<2.0",
]

# Dev/test dependencies — the §7.1 testing stack, one entry per row of that table.
# Upper caps are majors, so a breaking release of any of these cannot silently
# change what CI enforces. Install with `pip install -e ".[dev]"`.
[project.optional-dependencies]
dev = [
    # Test runner (§7.1). pytest-django gives us Django's TestCase/
    # TransactionTestCase semantics under pytest fixtures.
    "pytest>=9.1,<10.0",
    "pytest-django>=4.14,<5.0",
    # Property-based testing (§7.2). The `django` extra supplies
    # `hypothesis.extra.django.TestCase`/`TransactionTestCase` and
    # `from_model`, which the nine stateful machines need.
    "hypothesis[django]>=6.165,<7.0",
    # Fixtures: Leads/Deals in specific pipeline states (§7.1).
    "factory_boy>=3.3,<4.0",
    # Clock control: the 12h/30m session caps, the 15-minute lockout window,
    # the calling window across DST, the 60-second retry ladder (§7.1).
    "time-machine>=3.5,<4.0",
    # UI flows: a small set of end-to-end confirmations (§7.1, §7.4).
    "playwright>=1.62,<2.0",
    # Adapter doubles for the future live implementation (§7.1).
    "respx>=0.23,<1.0",
    # Architecture rules: the §3.0.1 / §3.7.2 layering contracts (§7.1, §7.6).
    "import-linter>=2.13,<3.0",
]

[tool.setuptools]
packages = [
    "config",
    "config.settings",
    "dashboard",
    "dashboard.discovery",
    "dashboard.qualification",
    "dashboard.outreach_strategy",
    "dashboard.deal_compliance",
    "dashboard.site_production",
    "dashboard.adapter",
    "dashboard.migrations",
    "dashboard.models",
    "dashboard.services",
    "dashboard.tests",
    "dashboard.views",
]
