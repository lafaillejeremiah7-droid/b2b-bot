<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Deal Room{% endblock %}</title>
  <style>
    :root{color-scheme:dark;background:#070b12;color:#edf3ff;font-family:Inter,ui-sans-serif,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#14213a 0,transparent 32rem),#070b12;color:#edf3ff}a{color:#9ec5ff;text-decoration:none}nav{position:sticky;top:0;z-index:4;display:flex;gap:18px;align-items:center;padding:16px 28px;background:#080d16e8;backdrop-filter:blur(18px);border-bottom:1px solid #ffffff12}.brand{font-weight:800;letter-spacing:-.03em;margin-right:auto}.wrap{max-width:1280px;margin:0 auto;padding:30px 22px}.panel{background:#0d1420d9;border:1px solid #ffffff12;border-radius:20px;padding:20px;box-shadow:0 20px 70px #0005}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}.muted{color:#91a0b8}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#ffffff0d;border:1px solid #ffffff12;font-size:12px;margin:2px}.danger{color:#ff9f9f}.ok{color:#9ee7b8}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid #ffffff10;vertical-align:top}input,select,textarea,button{font:inherit;color:inherit;background:#0a111d;border:1px solid #ffffff1b;border-radius:11px;padding:10px 12px}textarea{width:100%;min-height:110px}button{cursor:pointer;background:#eaf2ff;color:#07101f;font-weight:750;border:0}form.inline{display:inline}.stack{display:grid;gap:10px}.messages{display:grid;gap:8px;margin-bottom:16px}.message{padding:11px 14px;border-radius:12px;background:#ffffff0d}.kpi{font-size:28px;font-weight:800;letter-spacing:-.04em}.right{text-align:right}@media(max-width:700px){nav{gap:10px;overflow:auto}.wrap{padding:20px 12px}th:nth-child(n+4),td:nth-child(n+4){display:none}}
  </style>
</head>
<body>
<nav><a class="brand" href="/dashboard/">B2B Deal Room</a>{% if request.user.is_authenticated %}<a href="/leads/">Leads</a><a href="/analytics/">Analytics</a><a href="/notifications/">Notifications</a><a href="/audit/">Audit</a><form class="inline" method="post" action="/sign-out/">{% csrf_token %}<button>Sign out</button></form>{% endif %}</nav>
<main class="wrap">{% if messages %}<div class="messages">{% for message in messages %}<div class="message {{ message.tags }}">{{ message }}</div>{% endfor %}</div>{% endif %}{% block content %}{% endblock %}</main>
</body></html>
