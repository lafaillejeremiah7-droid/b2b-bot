name: Seven Bot CI

on:
  push:
    branches:
      - feat/b2b-runtime-foundation
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Compile
        run: python -m compileall -q config dashboard
      - name: Run service tests
        env:
          DJANGO_SECRET_KEY: ci-only-secret
        run: pytest dashboard/tests -q
