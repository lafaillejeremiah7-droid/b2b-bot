# CI for the Deal Room Dashboard (task 1.4).
#
# Design §7.6 opens with the reason this file exists: "a structural guarantee
# that is only documented is a convention." Every check below is a guarantee the
# design leans on, run as its own step so the build report says *which* one
# broke rather than that something did.
#
# The four steps task 1.4 owns:
#
#   1. pytest                        the whole suite (§7.1-§7.5)
#   2. lint-imports                  the §3.0.1 / §3.7.2 layering contracts
#   3. import-time assertions        the §3.5.1 / §3.5.5 constants (§7.6)
#   4. migration + privilege tests   task 3.5's fresh-migrate assertions
#
# plus a fifth that guards the ones not switched on yet:
#
#   5. deferred activations          nothing task 1.4 deferred was forgotten
#
# `if: ${{ !cancelled() }}` on steps 2-5 is deliberate. These are independent
# claims about the codebase, and a failing test suite should not hide a broken
# architecture contract — one push, one full picture.

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: tests and architecture checks
    runs-on: ubuntu-latest

    # ----------------------------------------------------------------------
    # PostgreSQL 16 as a service container.
    # ----------------------------------------------------------------------
    # Not the runner's preinstalled server, and not a local install step:
    # design §2.2 pins PostgreSQL 16 and the schema depends on version-specific
    # behaviour — GENERATED ALWAYS AS ... STORED columns, partial unique
    # indexes, TIMESTAMPTZ(3), INSERT ... ON CONFLICT, and the ten plpgsql
    # triggers of §4.6. A service container pins the major version in the
    # workflow instead of inheriting whatever the runner image ships this month.
    #
    # There is no SQLite fallback anywhere, by design. If this container fails to
    # come up the job fails; it does not degrade to a backend that cannot express
    # the constraints under test.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: deal_room
          POSTGRES_USER: deal_room_app
          POSTGRES_PASSWORD: deal_room_ci
        ports:
          - 5432:5432
        # POSTGRES_USER in the official image is a superuser, which the suite
        # needs for two specific things: CREATE DATABASE for pytest-django's
        # test database, and CREATE EXTENSION pg_trgm in migration 0001 (§4.7).
        #
        # That is a CI convenience and NOT the production grant. §3.1 and §3.7.3
        # require a restricted application role — no UPDATE or DELETE on
        # audit_entries (§3.7.4, Requirement 11.4). Task 3.1 installs those
        # grants and task 3.5 adds the privilege test that asserts them; both run
        # inside the test database, so they are unaffected by the connecting
        # role's own superuser status.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.base
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_DB: deal_room
      POSTGRES_USER: deal_room_app
      POSTGRES_PASSWORD: deal_room_ci
      # Design §7.2's floor profile. Named explicitly rather than relying on
      # conftest.py's default, so a change to that default is visible here.
      HYPOTHESIS_PROFILE: ci
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches requires-python = ">=3.11" and the local .venv.
          python-version: "3.11"
          cache: pip

      - name: Install the package and the dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Wait for PostgreSQL
        run: |
          for attempt in $(seq 1 30); do
            if pg_isready -h "$POSTGRES_HOST" -p "$POSTGRES_PORT" -U "$POSTGRES_USER"; then
              exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL did not become ready" >&2
          exit 1

      # --- 1: the test suite ------------------------------------------------
      # No --reuse-db: see the long note in pytest.ini. Every CI run builds the
      # test database from migrations, which is what makes step 4's assertions
      # about a fresh migrate mean anything.
      - name: pytest
        run: pytest

      # --- 2: the layering contracts (§3.0.1, §3.7.2, §7.6) -----------------
      # Invoked as the console script. `python -m importlinter.cli` resolves to a
      # click group with no command attached and exits 0 in silence — a check
      # that always passes is worse than no check.
      - name: lint-imports
        if: ${{ !cancelled() }}
        run: lint-imports

      # --- 3: import-time assertions (§7.6) ---------------------------------
      # The §3.5.1 / §3.5.5 assertions fire on any import, so ordinary
      # collection already executes them. This step exists because collection
      # can be filtered to a marker or a path and this cannot: the §3.7.2 claim
      # that no webhook can release a website or verify a payment must not
      # depend on which subset of the suite ran.
      #
      # A clean no-op until tasks 6.1 and 6.3 declare the constants. It needs no
      # edit then — it discovers them.
      - name: Import-time assertions
        if: ${{ !cancelled() }}
        run: python scripts/check_import_time_assertions.py

      # --- 4: the migration and privilege tests (task 3.5) ------------------
      # A separate step, not folded into step 1, because §7.4 is blunt about what
      # it proves: "the enforcement layers are only real if they are actually
      # deployed." A failure here means the ten triggers of §4.6, the §4.3
      # CHECKs, the generated columns, the genesis partial unique index, or the
      # §4.7 indexes are missing from a fresh migrate — a different kind of
      # broken from a failing unit test, and worth its own red X.
      #
      # pytest exits 5 when a selection collects nothing, which is the state
      # until task 3.5 writes these tests. Tolerated here, and ONLY here: step 5
      # fails the build the moment a migration installs a trigger while nothing
      # carries the marker, so the tolerance cannot outlive its reason.
      - name: Migration and privilege tests
        if: ${{ !cancelled() }}
        run: |
          set +e
          pytest -m migrations
          code=$?
          set -e
          if [ "$code" -eq 5 ]; then
            echo "::notice title=Task 3.5 pending::No tests carry the 'migrations' marker yet. The deferred-activation check fails this build once a migration installs a trigger without them."
            exit 0
          fi
          exit "$code"

      # --- 5: the guard on everything above that is not switched on yet -----
      # Three import-linter contracts are declared with empty source_modules and
      # the migrations marker is unused, because the modules and tests they
      # constrain do not exist yet. Both states are indistinguishable in CI
      # output from "the rule has subjects and is not being enforced". This step
      # is what distinguishes them.
      - name: Deferred activations
        if: ${{ !cancelled() }}
        run: python scripts/check_deferred_activations.py

      # Not yet wired, each owned by the task that first needs it:
      #   * `playwright install --with-deps chromium` before the first §7.4 e2e
      #     test (the `e2e` marker);
      #   * the §7.7 traceability check asserting that the union of validated
      #     criteria equals the full acceptance-criteria set;
      #   * the §7.2 template test for the shared `action_button` partial
      #     (task 7.2), which runs inside step 1 and needs no step of its own.
